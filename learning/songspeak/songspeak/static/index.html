<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SongSpeak</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf7f2; --card: #ffffff; --ink: #1d1b19; --muted: #6b655e; --line: #e6e0d6;
    --accent: #d2452b; --accent-ink: #ffffff; --chip: #f3ede4; --miss: #b3261e; --ok: #2e6b3f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151413; --card: #1f1d1b; --ink: #f1ece4; --muted: #a39c92; --line: #34302c;
            --accent: #ff6a4d; --accent-ink: #1a0e0b; --chip: #2a2724; --miss: #ff8a80; --ok: #8fd19e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .lede { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  textarea { width: 100%; min-height: 110px; resize: vertical; border: 1px solid var(--line); border-radius: 10px;
             padding: 12px; font: inherit; font-size: 1.1rem; background: var(--bg); color: var(--ink); }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-top: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--muted); }
  select { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  select:disabled { opacity: .5; }
  .counter { margin-left: auto; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .counter.over { color: var(--miss); font-weight: 600; }
  button, .btn { font: inherit; text-decoration: none; display: inline-block; font-weight: 600; border-radius: 10px; padding: 10px 18px; cursor: pointer; border: 1px solid var(--line);
           background: var(--chip); color: var(--ink); }
  .btn { color: var(--ink); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: progress; }
  .tiers { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .tiers button { border: 0; border-radius: 0; background: transparent; padding: 8px 14px; font-weight: 500; }
  .tiers button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  audio { width: 100%; margin: 4px 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .chip { background: var(--chip); border-radius: 10px; padding: 8px 12px; min-width: 0; }
  .chip b { display: block; font-size: 1.05rem; }
  .chip small { color: var(--muted); display: block; font-size: .75rem; overflow-wrap: anywhere; }
  .chip.missing { outline: 1.5px dashed var(--miss); background: transparent; }
  .chip.missing small { color: var(--miss); }
  .terms { font-size: .9rem; padding: 10px 12px; border-left: 3px solid var(--ok); background: var(--chip); border-radius: 6px; }
  .terms.warn { border-color: var(--miss); }
  ol.attr { padding-left: 20px; font-size: .85rem; color: var(--muted); overflow-wrap: anywhere; }
  .error { color: var(--miss); font-weight: 600; }
  .meta { font-size: .8rem; color: var(--muted); }
  .hidden { display: none; }
  a { color: var(--accent); }
  @media (max-width: 520px) { .counter { margin-left: 0; width: 100%; } }
</style>
</head>
<body>
<main>
  <h1>Song<span>Speak</span></h1>
  <p class="lede">Type a message. Hear it sung back, word by word, from Creative Commons songs.</p>

  <form class="card" id="form">
    <textarea id="message" aria-label="Your message" placeholder="Hello, everybody. Welcome to Singapore!"></textarea>
    <div class="row">
      <div class="tiers" role="group" aria-label="Plan">
        <button type="button" data-tier="free" aria-pressed="true">Free</button>
        <button type="button" data-tier="premium" aria-pressed="false">Premium preview</button>
      </div>
      <label>Mood <select id="mood" disabled><option value="">Any</option></select></label>
      <label>Mix <select id="mix"></select></label>
      <label>Missing words <select id="missing"><option value="silence">Silence</option><option value="tone">Beep</option></select></label>
      <span class="counter" id="counter">0 / 300</span>
    </div>
    <div class="row">
      <button class="primary" id="make" type="submit">Make it sing</button>
      <button id="shuffle" type="button" disabled>Shuffle songs</button>
      <span id="status" class="meta" role="status"></span>
    </div>
  </form>

  <section class="card hidden" id="result">
    <audio id="player" controls></audio>
    <div class="meta" id="summary"></div>
    <div class="chips" id="chips"></div>
    <p class="terms" id="terms"></p>
    <ol class="attr" id="attribution"></ol>
    <div class="row">
      <a id="download" class="btn" download>Download</a>
      <button id="copy" type="button">Copy credits</button>
    </div>
  </section>

  <p class="meta" id="libinfo"></p>
</main>
<script>
const $ = (id) => document.getElementById(id);
const MIX_LABELS = { "variety": "Variety (ransom note)", "fewest-songs": "Fewest songs (smoother)" };
let info = null, tier = "free", lastMessage = null;

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function applyTier() {
  const t = info.tiers[tier];
  document.querySelectorAll(".tiers button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tier === tier)));
  $("mood").disabled = !t.moods;
  if (!t.moods) $("mood").value = "";
  const mix = $("mix"), keep = mix.value;
  mix.replaceChildren(...t.mix_modes.map(m => { const o = el("option", null, MIX_LABELS[m] || m); o.value = m; return o; }));
  if (t.mix_modes.includes(keep)) mix.value = keep;
  updateCounter();
}

function updateCounter() {
  const max = info ? info.tiers[tier].max_chars : 300, n = $("message").value.length;
  $("counter").textContent = `${n.toLocaleString()} / ${max.toLocaleString()}`;
  $("counter").classList.toggle("over", n > max);
}

async function make(seed) {
  const message = $("message").value.trim() || $("message").placeholder;
  $("make").disabled = $("shuffle").disabled = true;
  $("status").textContent = "Finding words…"; $("status").className = "meta";
  try {
    const res = await fetch("/api/make", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, tier, seed, mood: $("mood").value || null, mix: $("mix").value, missing: $("missing").value }) });
    const data = await res.json();
    if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Something went wrong");
    lastMessage = message;
    show(data);
    $("status").textContent = "";
  } catch (err) {
    $("status").textContent = err.message; $("status").className = "error";
  } finally {
    $("make").disabled = false; $("shuffle").disabled = !lastMessage;
  }
}

function show(d) {
  $("result").classList.remove("hidden");
  $("player").src = d.audio_url; $("player").play().catch(() => {});
  $("download").href = d.audio_url;
  $("summary").textContent = `${d.seconds.toFixed(1)}s · ${d.clips} clips from ${d.songs} songs` +
    (d.missing.length ? ` · not in the library yet: ${d.missing.join(", ")}` : "");
  $("chips").replaceChildren(...d.segments.map(s => {
    const c = el("div", "chip" + (s.found ? "" : " missing"));
    c.append(el("b", null, s.text), el("small", null, s.found ? `${s.song} · ${s.artist}` : "not found"));
    if (s.found) c.title = `${s.song} by ${s.artist}, ${s.at} (${s.license})`;
    return c;
  }));
  $("terms").textContent = d.terms; $("terms").classList.toggle("warn", d.terms_conflict);
  $("attribution").replaceChildren(...d.attribution.map(a => el("li", null, a)));
  $("copy").onclick = () => navigator.clipboard.writeText([d.terms, ...d.attribution].join("\n"))
    .then(() => { $("copy").textContent = "Copied"; setTimeout(() => $("copy").textContent = "Copy credits", 1500); });
}

$("form").addEventListener("submit", (e) => { e.preventDefault(); make(null); });
$("shuffle").addEventListener("click", () => make(Math.floor(Math.random() * 1e9)));
$("message").addEventListener("input", updateCounter);
document.querySelectorAll(".tiers button").forEach(b => b.addEventListener("click", () => { tier = b.dataset.tier; applyTier(); }));

fetch("/api/library").then(r => r.json()).then(d => {
  info = d;
  $("mood").append(...d.moods.map(m => { const o = el("option", null, m); o.value = m; return o; }));
  applyTier();
  const lic = Object.entries(d.licenses).map(([k, v]) => `${k} ×${v}`).join(", ");
  $("libinfo").textContent = `Library: ${d.usable_songs} songs, ${d.vocabulary.toLocaleString()} distinct sung words` +
    (lic ? ` · ${lic}` : "") + (d.personal_mode ? " · personal mode (includes non-commercial songs)" : "");
});
</script>
</body>
</html>

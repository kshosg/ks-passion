[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "songspeak"
version = "0.1.0"
description = "Turn a typed message into audio stitched together from words sung in songs."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
ingest = ["faster-whisper>=1.0"]
vocals = ["demucs>=4.0"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=7", "httpx>=0.27", "fastapi>=0.110"]

[project.scripts]
songspeak = "songspeak.cli:main"

[tool.setuptools]
packages = ["songspeak", "songspeak.sources"]

[tool.setuptools.package-data]
songspeak = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
